<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FleetView — GPS Fleet Tracking</title>
    <meta name="description" content="Live GPS fleet tracking dashboard with real-time vehicle positions, per-device personalisation and history trails." />
    <meta name="theme-color" content="#FAF6EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171310" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script>
    
      (function () {
        try {
          var stored = localStorage.getItem('fleetview.theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
         
        }
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
